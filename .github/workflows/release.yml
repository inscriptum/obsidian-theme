name: Release Obsidian theme
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "RELEASE_TAG '$RELEASE_TAG' is not a strict x.y.z version" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line.startsWith(`## [${process.env.RELEASE_TAG}]`));
          if (start < 0) throw new Error('No changelog section for this release');
          const end = lines.findIndex((line, i) => i > start && line.startsWith('## '));
          writeFileSync('release-notes.md', lines.slice(start, end < 0 ? undefined : end).join('\n'));
          JS
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(manifest.json theme.css LICENSE THIRD-PARTY-NOTICES.md licenses/Apache-2.0.txt licenses/Inter-OFL.txt licenses/Obsidian-sample-0BSD.txt licenses/Inscriptum-plugin-MIT.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "Inscriptum $RELEASE_TAG" --notes-file release-notes.md "${assets[@]}"
          fi
